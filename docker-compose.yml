services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000   # server-side; the browser only talks to this site
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  # Ready for the Postgres store (schema in migrations/001_init.sql).
  # Enable when backend/database/postgres.py replaces the in-memory store.
